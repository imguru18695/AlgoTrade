<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — Convexity Systems</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,440;0,9..144,560;1,9..144,440&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #0b0704;
    --ink: #f3ead0;
    --ink-dim: #b8a482;
    --muted: #8a7148;
    --line: rgba(201, 151, 47, 0.22);
    --accent: #d4a24e;
    --accent-soft: rgba(212, 162, 78, 0.16);
    --accent-dim: rgba(212, 162, 78, 0.55);
    --danger: #e0664a;
    --danger-soft: rgba(224, 102, 74, 0.12);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .field { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .field svg { width: 100%; height: 100%; display: block; }
  .bg-star { fill: var(--ink-dim); }
  @media (prefers-reduced-motion: no-preference) {
    .bg-star { animation: twinkle 4.5s ease-in-out infinite; }
  }
  @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }

  .panel {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: rgba(21, 15, 8, 0.6);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 36px 32px;
    backdrop-filter: blur(6px);
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-dim);
    margin: 0 0 10px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 480;
    font-size: 28px;
    line-height: 1.1;
    margin: 0 0 28px;
    color: var(--ink);
  }

  .field-group { margin-bottom: 18px; }
  label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--accent-dim); }

  .error {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--danger-soft);
    border: 1px solid rgba(224, 102, 74, 0.35);
    color: var(--danger);
    font-size: 13px;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 18px;
  }

  .btn {
    width: 100%;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: 0.01em;
    padding: 13px 22px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #1c1206;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin-top: 6px;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .btn:hover { box-shadow: 0 6px 28px rgba(212, 162, 78, 0.28); transform: translateY(-1px); }

  .back {
    display: block;
    text-align: center;
    margin-top: 22px;
    font-size: 13px;
    color: var(--ink-dim);
    text-decoration: none;
  }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="field" aria-hidden="true">
  <svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
    <circle class="bg-star" cx="80" cy="120" r="1.4" style="animation-delay:0.2s"/>
    <circle class="bg-star" cx="220" cy="60" r="1.2" style="animation-delay:1.4s"/>
    <circle class="bg-star" cx="700" cy="150" r="1.6" style="animation-delay:2.6s"/>
    <circle class="bg-star" cx="650" cy="680" r="1.3" style="animation-delay:0.8s"/>
    <circle class="bg-star" cx="120" cy="700" r="1.5" style="animation-delay:3.1s"/>
    <circle class="bg-star" cx="740" cy="400" r="1.3" style="animation-delay:1.9s"/>
    <circle class="bg-star" cx="60" cy="420" r="1.4" style="animation-delay:0.5s"/>
    <circle class="bg-star" cx="400" cy="40" r="1.2" style="animation-delay:2.2s"/>
    <circle class="bg-star" cx="400" cy="760" r="1.4" style="animation-delay:3.6s"/>
    <circle class="bg-star" cx="300" cy="650" r="1.3" style="animation-delay:1.1s"/>
  </svg>
</div>

<div class="panel">
  <p class="eyebrow">Convexity Systems</p>
  <h1>Sign in to your terminal</h1>

  {% if error %}
  <div class="error">Invalid user ID or password.</div>
  {% endif %}

  <form method="post" action="/login">
    <div class="field-group">
      <label for="username">User ID</label>
      <input type="text" id="username" name="username" placeholder="User ID" autocomplete="username" required autofocus>
    </div>
    <div class="field-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">
      Sign In
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </button>
  </form>

  <a class="back" href="/">← Back</a>
</div>

</body>
</html>
