<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoPlatform</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css?v=19">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <span class="logo">AlgoPlatform</span>
            <span class="market-status" id="market-status-badge">—</span>
        </div>
        <nav class="header-nav">
            <a href="/live" class="nav-link {% if active_page == 'dashboard' %}nav-active{% endif %}">Dashboard</a>
            <a href="/management" class="nav-link {% if active_page == 'management' %}nav-active{% endif %}">Management</a>
            <a href="/logs" class="nav-link {% if active_page == 'logs' %}nav-active{% endif %}">Logs</a>
            <a href="/strategies" class="nav-link {% if active_page == 'strategies' %}nav-active{% endif %}">Strategies</a>
            <a href="/execution" class="nav-link {% if active_page == 'execution' %}nav-active{% endif %}">Execution</a>
        </nav>
        <div class="header-right">
            {% if user_id %}
            <span class="user-id">{{ user_id }}</span>
            {% endif %}
            <span class="header-clock" id="header-clock"></span>
            <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" role="switch" aria-label="Toggle light or dark theme" title="Toggle theme">
                <span class="theme-toggle-track">
                    <svg class="theme-ico theme-ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="theme-ico theme-ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <span class="theme-toggle-thumb"></span>
                </span>
            </button>
            <button class="btn-ghost btn-refresh" id="refresh-btn" onclick="manualRefresh(this)">⟳</button>
            <a href="/auth/logout" class="btn-ghost">Logout</a>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
    // ── Theme ─────────────────────────────────────────────────────
    (function() {
        const saved = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
    })();

    function _syncThemeToggle(theme) {
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.setAttribute('aria-checked', theme === 'dark' ? 'true' : 'false');
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        _syncThemeToggle(next);
    }

    window.addEventListener('DOMContentLoaded', function() {
        _syncThemeToggle(document.documentElement.getAttribute('data-theme') || 'dark');
    });

    function manualRefresh(btn) {
        btn.disabled = true;
        btn.textContent = '⟳';
        location.reload();
    }

    // ── IST clock + market status ─────────────────────────────────
    function istNow() {
        const now = new Date();
        const utc = now.getTime() + now.getTimezoneOffset() * 60000;
        return new Date(utc + 5.5 * 3600000);
    }
    function isMarketOpen(ist) {
        const mins = ist.getHours() * 60 + ist.getMinutes();
        return mins >= 9 * 60 + 15 && mins < 15 * 60 + 30;
    }
    function isPreMarket(ist) {
        const mins = ist.getHours() * 60 + ist.getMinutes();
        return mins >= 9 * 60 && mins < 9 * 60 + 15;
    }
    function tickClock() {
        const ist = istNow();
        const hh = String(ist.getHours()).padStart(2,'0');
        const mm = String(ist.getMinutes()).padStart(2,'0');
        const ss = String(ist.getSeconds()).padStart(2,'0');
        const clockEl = document.getElementById('header-clock');
        const statusEl = document.getElementById('market-status-badge');
        if (clockEl) clockEl.textContent = `${hh}:${mm}:${ss} IST`;
        if (statusEl) {
            if (isMarketOpen(ist)) {
                statusEl.textContent = '● OPEN';
                statusEl.className = 'market-status market-open';
            } else if (isPreMarket(ist)) {
                statusEl.textContent = '◑ PRE';
                statusEl.className = 'market-status market-pre';
            } else {
                statusEl.textContent = '○ CLOSED';
                statusEl.className = 'market-status market-closed';
            }
        }
    }
    tickClock();
    setInterval(tickClock, 1000);
    </script>
</body>
</html>
