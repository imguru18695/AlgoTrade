<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convexity Systems</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,440;0,9..144,560;1,9..144,440&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #0b0704;
    --bg-2: #150f08;
    --ink: #f3ead0;
    --ink-dim: #b8a482;
    --muted: #8a7148;
    --line: rgba(201, 151, 47, 0.14);
    --accent: #d4a24e;
    --accent-soft: rgba(212, 162, 78, 0.16);
    --accent-dim: rgba(212, 162, 78, 0.55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .stage {
    position: relative;
    min-height: 620px;
    padding: clamp(28px, 5vw, 56px) clamp(20px, 6vw, 88px) clamp(48px, 6vw, 72px);
    display: flex;
    flex-direction: column;
    isolation: isolate;
  }

  /* ── Ambient chakra / armillary field ────────────────────────────── */
  .field {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .field svg { width: 100%; height: 100%; display: block; }
  .bg-star { fill: var(--ink-dim); }

  /* A wheel = one tilted ring (an ellipse pre-rotated in its own path data
     via the arc command's x-axis-rotation, not CSS) plus the medallion
     riding it. Rotating the whole group rigidly around the shared hub is
     what carries the medallion around its ring — six wheels at different
     tilts and eccentricities read as rings on different orbital planes,
     like a real armillary sphere / gyroscope, rather than flat concentric
     circles. There is no central body — the hub is just the spoked wheel
     itself, so the medallions are the sole focus. */
  .wheel { transform-box: view-box; transform-origin: 1050px 380px; }
  .wheel-path { fill: none; stroke: var(--muted); }

  /* No disc behind each symbol — just a soft glow (a radial gradient, not a
     blur filter, so the glyph itself stays crisp) and a faint cast shadow
     duplicate, so the bare glyph has some presence in open space rather
     than reading as flat clip-art. */
  .symbol-glow { opacity: 0.85; }

  /* The symbol orbits by riding its wheel's rotation, which would also spin
     the glyph itself upside-down over the course of each lap. .despin plays
     an equal, opposite rotation at the same duration so the two cancel —
     the symbol travels around the ring but its own orientation stays put. */
  .despin { transform-box: fill-box; transform-origin: center; }

  .spokes {
    stroke: var(--muted);
    stroke-width: 1;
    opacity: 0.12;
    transform-box: view-box;
    transform-origin: 1050px 380px;
  }
  .hub-ring { fill: none; stroke: var(--accent-dim); stroke-width: 1.2; opacity: 0.55; }

  @media (prefers-reduced-motion: no-preference) {
    .bg-star { animation: twinkle 4.5s ease-in-out infinite; }

    .wheel-a { animation: spin 60s linear infinite; }
    .wheel-b { animation: spin 95s linear infinite reverse; }
    .wheel-c { animation: spin 130s linear infinite; }
    .wheel-d { animation: spin 170s linear infinite reverse; }
    .wheel-e { animation: spin 210s linear infinite; }
    .wheel-f { animation: spin 260s linear infinite reverse; }
    .spokes { animation: spin 480s linear infinite; }

    /* same duration as the matching wheel, opposite direction */
    .despin-a { animation: spin 60s linear infinite reverse; }
    .despin-b { animation: spin 95s linear infinite; }
    .despin-c { animation: spin 130s linear infinite reverse; }
    .despin-d { animation: spin 170s linear infinite; }
    .despin-e { animation: spin 210s linear infinite reverse; }
    .despin-f { animation: spin 260s linear infinite; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes twinkle {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 0.95; }
  }

  /* ── Hero ─────────────────────────────────────────────────────────── */
  .hero {
    position: relative;
    z-index: 1;
    margin-top: auto;
    padding-top: clamp(56px, 12vh, 120px);
    max-width: 760px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-dim);
    margin: 0 0 18px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 440;
    font-size: clamp(42px, 8vw, 84px);
    line-height: 1.02;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
    text-wrap: balance;
  }
  h1 em {
    font-style: italic;
    font-weight: 440;
    color: var(--accent);
  }

  .cta-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    margin-top: clamp(32px, 5vh, 52px);
  }
  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.01em;
    padding: 13px 22px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .btn-primary {
    background: var(--accent);
    color: #1c1206;
    border: 1px solid var(--accent);
    box-shadow: 0 0 0 rgba(212, 162, 78, 0);
  }
  .btn-primary:hover { box-shadow: 0 6px 28px rgba(212, 162, 78, 0.28); transform: translateY(-1px); }
  .btn svg { width: 13px; height: 13px; transition: transform 0.15s ease; }
  .btn:hover svg { transform: translateX(2px); }

  @media (max-width: 640px) {
    .stage { min-height: 560px; }
    .cta-row { gap: 10px; }
    .btn { padding: 12px 18px; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .fade-up { animation: fadeUp 0.7s cubic-bezier(.2,.7,.2,1) both; }
    .fade-up.d1 { animation-delay: 0.05s; }
    .fade-up.d2 { animation-delay: 0.15s; }
    .fade-up.d3 { animation-delay: 0.25s; }
    .fade-up.d4 { animation-delay: 0.35s; }
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<div class="stage">
  <div class="field" aria-hidden="true">
    <svg viewBox="0 0 1440 760" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="haloGold" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="haloIvory" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--ink)" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="var(--ink)" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="haloDim" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--ink-dim)" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="var(--ink-dim)" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Distant background stars (cosmos backdrop, outside the wheel) -->
      <circle class="bg-star" cx="120" cy="90" r="1.6" style="animation-delay:0.2s"/>
      <circle class="bg-star" cx="300" cy="220" r="1.4" style="animation-delay:1.4s"/>
      <circle class="bg-star" cx="220" cy="560" r="1.7" style="animation-delay:2.6s"/>
      <circle class="bg-star" cx="500" cy="120" r="1.4" style="animation-delay:0.8s"/>
      <circle class="bg-star" cx="70" cy="380" r="1.8" style="animation-delay:3.1s"/>
      <circle class="bg-star" cx="1380" cy="140" r="1.6" style="animation-delay:1.9s"/>
      <circle class="bg-star" cx="1320" cy="700" r="1.4" style="animation-delay:0.5s"/>
      <circle class="bg-star" cx="1400" cy="420" r="1.7" style="animation-delay:2.2s"/>
      <circle class="bg-star" cx="620" cy="80" r="1.4" style="animation-delay:3.6s"/>
      <circle class="bg-star" cx="780" cy="150" r="1.5" style="animation-delay:1.1s"/>
      <circle class="bg-star" cx="1150" cy="90" r="1.4" style="animation-delay:2.9s"/>
      <circle class="bg-star" cx="450" cy="650" r="1.6" style="animation-delay:0.1s"/>
      <circle class="bg-star" cx="980" cy="700" r="1.4" style="animation-delay:1.6s"/>
      <circle class="bg-star" cx="180" cy="180" r="1.5" style="animation-delay:2.4s"/>
      <circle class="bg-star" cx="1250" cy="600" r="1.5" style="animation-delay:3.3s"/>
      <circle class="bg-star" cx="60" cy="600" r="1.4" style="animation-delay:0.9s"/>
      <circle class="bg-star" cx="650" cy="700" r="1.6" style="animation-delay:2.0s"/>
      <circle class="bg-star" cx="1420" cy="600" r="1.4" style="animation-delay:1.2s"/>
      <circle class="bg-star" cx="400" cy="40" r="1.5" style="animation-delay:3.8s"/>
      <circle class="bg-star" cx="1250" cy="40" r="1.4" style="animation-delay:0.6s"/>

      <!-- Chakra wheel — a spoked hub (the literal sense of "chakra": wheel)
           beneath six tilted rings. Each ring's ellipse is pre-rotated in
           its own path data (arc command x-axis-rotation), not via CSS, so
           six different tilts and eccentricities cross like the rings of an
           armillary sphere. Every ring carries one floating symbol, rotating
           as a rigid unit with its ring — six symbols, six planes, one hub. -->
  <g class="spokes">
    <line x1="1092.0" y1="380.0" x2="1395.0" y2="380.0"/>
    <line x1="1088.8" y1="396.1" x2="1368.7" y2="512.0"/>
    <line x1="1079.7" y1="409.7" x2="1294.0" y2="624.0"/>
    <line x1="1066.1" y1="418.8" x2="1182.0" y2="698.7"/>
    <line x1="1050.0" y1="422.0" x2="1050.0" y2="725.0"/>
    <line x1="1033.9" y1="418.8" x2="918.0" y2="698.7"/>
    <line x1="1020.3" y1="409.7" x2="806.0" y2="624.0"/>
    <line x1="1011.2" y1="396.1" x2="731.3" y2="512.0"/>
    <line x1="1008.0" y1="380.0" x2="705.0" y2="380.0"/>
    <line x1="1011.2" y1="363.9" x2="731.3" y2="248.0"/>
    <line x1="1020.3" y1="350.3" x2="806.0" y2="136.0"/>
    <line x1="1033.9" y1="341.2" x2="918.0" y2="61.3"/>
    <line x1="1050.0" y1="338.0" x2="1050.0" y2="35.0"/>
    <line x1="1066.1" y1="341.2" x2="1182.0" y2="61.3"/>
    <line x1="1079.7" y1="350.3" x2="1294.0" y2="136.0"/>
    <line x1="1088.8" y1="363.9" x2="1368.7" y2="248.0"/>
    <circle class="hub-ring" cx="1050" cy="380" r="50"/>
  </g>

  <g class="wheel wheel-a">
    <path class="wheel-path" d="M 1144.1,393.2 A 95,58 8 1,0 955.9,366.8 A 95,58 8 1,0 1144.1,393.2" style="opacity:0.34"/>
    <g class="symbol" transform="translate(964.4,347.9)">
      <g class="despin despin-a">
        <circle class="symbol-glow" fill="url(#haloIvory)" r="31.5"/>
        <g transform="translate(1.1,1.6)"><text x="0" y="0" dy="0.35em" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="25.5" font-weight="500" fill="rgba(0,0,0,0.35)">Δ</text></g>
        <text x="0" y="0" dy="0.35em" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="25.5" font-weight="500" fill="var(--ink)">Δ</text>
      </g>
    </g>
  </g>

  <g class="wheel wheel-b">
    <path class="wheel-path" d="M 933.7,461.4 A 142,54 145 1,0 1166.3,298.6 A 142,54 145 1,0 933.7,461.4" style="opacity:0.28"/>
    <g class="symbol" transform="translate(941.0,414.0)">
      <g class="despin despin-b">
        <circle class="symbol-glow" fill="url(#haloGold)" r="33.6"/>
        <g transform="translate(1.1,1.6)"><text x="0" y="0" dy="0.35em" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="27.2" font-weight="500" fill="rgba(0,0,0,0.35)">Γ</text></g>
        <text x="0" y="0" dy="0.35em" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="27.2" font-weight="500" fill="var(--accent)">Γ</text>
      </g>
    </g>
  </g>

  <g class="wheel wheel-c">
    <path class="wheel-path" d="M 1170.8,524.0 A 188,102 50 1,0 929.2,236.0 A 188,102 50 1,0 1170.8,524.0" style="opacity:0.23"/>
    <g class="symbol" transform="translate(1164.8,367.6)">
      <g class="despin despin-c">
        <circle class="symbol-glow" fill="url(#haloDim)" r="31.5"/>
        <g transform="translate(1.1,1.6)"><text x="0" y="0" dy="0.35em" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="25.5" font-weight="500" fill="rgba(0,0,0,0.35)">Σ</text></g>
        <text x="0" y="0" dy="0.35em" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="25.5" font-weight="500" fill="var(--ink-dim)">Σ</text>
      </g>
    </g>
  </g>

  <g class="wheel wheel-d">
    <path class="wheel-path" d="M 1009.7,151.5 A 232,68 260 1,0 1090.3,608.5 A 232,68 260 1,0 1009.7,151.5" style="opacity:0.19"/>
    <g class="symbol" transform="translate(1128.1,484.0)">
      <g class="despin despin-d">
        <circle class="symbol-glow" fill="url(#haloIvory)" r="29.4"/>
        <g transform="translate(1.1,1.6)"><text x="0" y="0" dy="0.35em" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="23.8" font-weight="500" fill="rgba(0,0,0,0.35)">%</text></g>
        <text x="0" y="0" dy="0.35em" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="23.8" font-weight="500" fill="var(--ink)">%</text>
      </g>
    </g>
  </g>

  <g class="wheel wheel-e">
    <path class="wheel-path" d="M 1289.0,242.0 A 276,138 330 1,0 811.0,518.0 A 276,138 330 1,0 1289.0,242.0" style="opacity:0.15"/>
    <g class="symbol" transform="translate(1298.7,277.6)">
      <g class="despin despin-e">
        <circle class="symbol-glow" fill="url(#haloGold)" r="33.6"/>
        <g transform="translate(1.1,1.6)"><line x1="-6.9" y1="-9.2" x2="-6.9" y2="9.2" stroke="rgba(0,0,0,0.35)" stroke-width="1.8" stroke-linecap="round"/><rect x="-8.8" y="-4.6" width="3.8" height="6.9" fill="rgba(0,0,0,0.35)"/><line x1="0.0" y1="-10.3" x2="0.0" y2="10.3" stroke="rgba(0,0,0,0.35)" stroke-width="1.8" stroke-linecap="round"/><rect x="-1.9" y="-6.9" width="3.8" height="10.3" fill="rgba(0,0,0,0.35)"/><line x1="6.9" y1="-8.0" x2="6.9" y2="6.9" stroke="rgba(0,0,0,0.35)" stroke-width="1.8" stroke-linecap="round"/><rect x="5.0" y="-2.3" width="3.8" height="6.9" fill="rgba(0,0,0,0.35)"/></g>
        <line x1="-6.9" y1="-9.2" x2="-6.9" y2="9.2" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/><rect x="-8.8" y="-4.6" width="3.8" height="6.9" fill="var(--accent)"/><line x1="0.0" y1="-10.3" x2="0.0" y2="10.3" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/><rect x="-1.9" y="-6.9" width="3.8" height="10.3" fill="var(--accent)"/><line x1="6.9" y1="-8.0" x2="6.9" y2="6.9" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/><rect x="5.0" y="-2.3" width="3.8" height="6.9" fill="var(--accent)"/>
      </g>
    </g>
  </g>

  <g class="wheel wheel-f">
    <path class="wheel-path" d="M 913.9,671.8 A 322,88 115 1,0 1186.1,88.2 A 322,88 115 1,0 913.9,671.8" style="opacity:0.12"/>
    <g class="symbol" transform="translate(1198.6,220.9)">
      <g class="despin despin-f">
        <circle class="symbol-glow" fill="url(#haloDim)" r="35.7"/>
        <g transform="translate(1.1,1.6)"><polyline points="-10.3,4.6 -4.6,-3.4 1.1,3.4 6.9,-8.0 11.5,-2.3" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11.5" cy="-2.3" r="1.9" fill="rgba(0,0,0,0.35)"/></g>
        <polyline points="-10.3,4.6 -4.6,-3.4 1.1,3.4 6.9,-8.0 11.5,-2.3" fill="none" stroke="var(--ink-dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11.5" cy="-2.3" r="1.9" fill="var(--ink-dim)"/>
      </g>
    </g>
  </g>
    </svg>
  </div>

  <div class="hero">
    <p class="eyebrow fade-up d1">Derivatives Intelligence</p>
    <h1 class="fade-up d2">Convexity<br><em>Systems</em></h1>

    <div class="cta-row fade-up d4">
      <a class="btn btn-primary" href="/login">
        Enter Terminal
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </a>
    </div>
  </div>

</div>

</body>
</html>
